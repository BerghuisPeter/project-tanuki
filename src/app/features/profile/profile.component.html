<div *transloco="let t" class="flex min-h-[80vh] items-center justify-center p-4">
  <mat-card class="w-full max-w-md p-6">
    <mat-card-header class="mb-4">
      <mat-card-title class="text-2xl font-bold">{{ t('profile.title') }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div class="flex flex-col items-center gap-4 mb-6">
        <app-image-selection
          (filesChanged)="onAvatarFilesChanged($event)"
          (removeRequested)="removeAvatar()"
          [currentImageUrl]="profileForm.get('avatarUrl')?.value"
          [disabled]="isUploading() || isSaving()"
          [hint]="t('profile.text.uploadLimits')"
          [label]="t('profile.button.uploadAvatar')"
          [loading]="isUploading()"
          previewAlt="Avatar preview"
        />
      </div>

      <div class="border-b border-gray-200 mb-6"></div>

      <form (ngSubmit)="onSubmit()" [formGroup]="profileForm" class="flex flex-col gap-4">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>{{ t('profile.label.displayName') }}</mat-label>
          <input [placeholder]="t('profile.placeholder.displayName')"
                 formControlName="displayName"
                 matInput>
          @if (profileForm.get('displayName')?.hasError('maxlength')) {
            <mat-error>{{ t('profile.error.displayNameMaxlength') }}</mat-error>
          }
        </mat-form-field>

        <div class="flex flex-col md:flex-row md:gap-4">
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>{{ t('profile.label.colorPreference') }}</mat-label>
            <div class="flex items-center gap-2">
              <input class="color-picker-square" formControlName="color" matInput type="color">
            </div>
            @if (profileForm.get('color')?.value) {
              <button (click)="clearColor()" [matTooltip]="t('profile.tooltip.clearColor')"
                      mat-icon-button matSuffix size="small"
                      type="button">
                <mat-icon>format_color_reset</mat-icon>
              </button>
            }
          </mat-form-field>
        </div>

        <div class="flex flex-col md:flex-row justify-end gap-2 mt-4">
          @if (profileForm.dirty) {
            <button (click)="onReset()" [disabled]="isSaving()" color="warn"
                    mat-button type="button">
              {{ t('profile.button.reset') }}
            </button>
          }
          <button
            [disabled]="isSaving() || isUploading() || profileForm.invalid || !profileForm.dirty"
            color="primary"
            mat-raised-button
            type="submit">
            @if (isSaving()) {
              <span>{{ t('profile.button.saving') }}</span>
            } @else {
              <span>{{ t('profile.button.save') }}</span>
            }
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
