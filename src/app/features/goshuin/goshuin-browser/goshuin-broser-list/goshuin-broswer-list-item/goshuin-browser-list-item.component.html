<div class="flex flex-col md:flex-row border border-gray-600">
  <div class="relative grow basis-0">
    <div class="absolute top-3 left-3 flex flex-col gap-1 text-white">
      <div
        class="px-3 py-1 rounded-full bg-gray-800 w-fit border border-gray-600">{{ goshuin().temple.affiliationType }}
      </div>
      <div class="px-3 py-1 rounded-full bg-gray-800 w-fit border border-gray-600">{{ goshuin().format }}</div>
      <div class="px-3 py-1 rounded-full bg-gray-800 w-fit border border-gray-600">
        {{ goshuin().pages }}
      </div>
    </div>
    <div
      class="absolute bottom-0 left-0 flex flex-col bg-[linear-gradient(to_top,color-mix(in_srgb,var(--mat-sys-surface)_80%,transparent)_0%,color-mix(in_srgb,var(--mat-sys-surface)_50%,transparent)_70%,transparent_100%)] w-full p-3">
      <span class="font-medium text-lg">{{ goshuin().translations[currentLocale()]?.label }}</span>
      <button class="w-fit !pl-0" mat-button>
        <mat-icon class="">location_on</mat-icon>
        {{ goshuin().temple.translations[currentLocale()]?.address }}
      </button>
    </div>
    <img [src]="goshuin().images?.[0]?.url" alt="goshuin" class="responsive-image">
  </div>
  <div class="flex flex-col gap-2 p-3 md:flex justify-between grow basis-0">
    <div class="flex flex-col gap-2 hidden md:flex">
      <h2 class="text-lg">{{ goshuin().translations[currentLocale()]?.label }}</h2>
      <p>{{ goshuin().translations[currentLocale()]?.description }}</p>
    </div>
    <div class="flex justify-between items-center">
      <div class="flex gap-4 items-center">
        <mat-icon>account_box</mat-icon>
        <div class="flex flex-col ">
          <span class="text-gray-200">UserName</span>
          <span class="text-xs text-gray-400">date added under</span>
        </div>
      </div>
      <button mat-button>
        <mat-icon>comment</mat-icon>
        12
      </button>
    </div>
  </div>

</div>
