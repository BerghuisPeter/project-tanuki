user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {

    gzip on;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    server {
        listen ${PORT};
        server_name _;

        # Disable absolute redirects and port in redirects to prevent Nginx from
        # adding the internal port (8080) and switching to http when the user
        # is accessing the site via https proxy.
        absolute_redirect off;
        port_in_redirect off;
        server_name_in_redirect off;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/mime.types;

        # Redirect root to /en/
        location = / {
            absolute_redirect off;
            port_in_redirect off;
            return 301 /en/;
        }

        # Cache static assets (Angular bundles are hashed)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Prevent caching index.html so new deployments load correctly
        location = /en/index.html {
            add_header Cache-Control "no-cache";
        }

        location = /fr/index.html {
            add_header Cache-Control "no-cache";
        }

        # Angular SPA routing for English
        location /en/ {
            absolute_redirect off;
            port_in_redirect off;
            try_files $uri $uri/ /en/index.html;
        }

        # Angular SPA routing for French
        location /fr/ {
            absolute_redirect off;
            port_in_redirect off;
            try_files $uri $uri/ /fr/index.html;
        }

        # Catch-all for other paths (optional, could redirect to /en/ as well)
        location / {
            absolute_redirect off;
            port_in_redirect off;
            try_files $uri $uri/ /en/index.html;
        }
    }
}
