<ng-container *transloco="let t">
  <div [formGroup]="service.filterForm" class="flex flex-col gap-2 p-2 md:p-4">
    <div class="flex flex-col gap-1 md:gap-2 md:flex-row">
      <app-debounced-search-field [debounceMs]="service.searchDebounceTime"
                                  class="grow"
                                  formControlName="search"
                                  label="Search"
                                  placeholder="By temple, city..."
      />
      <a [routerLink]="fullMapLink" class="md:mt-2" color="primary" mat-stroked-button>
        <mat-icon color="primary" fontIcon="map"></mat-icon>
        <span>{{ t('goshuin.browse.goToMap') }}</span>
      </a>
    </div>
    <app-goshuin-filter-panel/>
    <mat-divider></mat-divider>
    <div class="flex flex-col gap-2">
      @if (service.isLoadingQuery()) {
        <app-loading/>
      } @else {
        @for (result of service.searchResults(); track result.id) {
          <mat-card>
            <div class="flex flex-col gap-2 p-2">
              <h2 class="text-lg">{{ result.translations[currentLocale()]?.label }}</h2>
              <p class="text-sm">{{ result.translations[currentLocale()]?.description }}</p>
            </div>
          </mat-card>
        } @empty {
          <p class="text-center">No results found</p>
        }
      }
    </div>
  </div>
</ng-container>
