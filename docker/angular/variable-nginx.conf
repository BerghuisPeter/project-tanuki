user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {

    gzip on;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    server {
        listen ${PORT};
        server_name _;

        absolute_redirect off;
        port_in_redirect off;
        server_name_in_redirect off;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/mime.types;

        # Redirect root to /en/
        location = / {
            return 301 $http_x_forwarded_proto://$host/en/;
        }

        # Cache static assets (Angular bundles are hashed)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Prevent caching index.html so new deployments load correctly
        location = /en/index.html {
            add_header Cache-Control "no-cache";
        }

        location = /fr/index.html {
            add_header Cache-Control "no-cache";
        }

        location = /ja/index.html {
            add_header Cache-Control "no-cache";
        }

        location = /nl/index.html {
            add_header Cache-Control "no-cache";
        }

        # Angular SPA routing for English
        location /en/ {
            try_files $uri $uri/ /en/index.html;
        }

        # Angular SPA routing for French
        location /fr/ {
            try_files $uri $uri/ /fr/index.html;
        }

        # Angular SPA routing for Japanese
        location /ja/ {
            try_files $uri $uri/ /ja/index.html;
        }

        # Angular SPA routing for Dutch
        location /nl/ {
            try_files $uri $uri/ /nl/index.html;
        }

        # Catch-all for other paths
        location / {
            try_files $uri $uri/ /en/index.html;
        }
    }
}
