<div class="flex h-110 flex-col border border-gray-600 animate-pulse md:flex-row">
  <!-- Image Skeleton -->
  <div class="relative h-48 grow bg-gray-700 md:h-full md:basis-0">
    <div class="absolute top-3 left-3 flex flex-col gap-1">
      <div class="h-6 w-24 bg-gray-600 rounded-full"></div>
      <div class="h-6 w-16 bg-gray-600 rounded-full"></div>
      <div class="h-6 w-12 bg-gray-600 rounded-full"></div>
    </div>
    <div
      class="absolute bottom-0 left-0 flex w-full flex-col gap-2 p-3 md:hidden bg-[linear-gradient(to_top,color-mix(in_srgb,var(--mat-sys-surface)_80%,transparent),color-mix(in_srgb,var(--mat-sys-surface)_50%,transparent)_70%,transparent_100%)]">
      <div class="h-7 w-3/4 rounded bg-gray-600"></div>
      <div class="h-9 w-2/3 rounded bg-gray-600"></div>
    </div>
  </div>

  <!-- Content Skeleton -->
  <div class="flex basis-0 flex-col justify-between gap-2 p-3 md:grow md:basis-0">
    <div class="flex flex-col gap-2 hidden md:flex grow min-h-0">
      <div class="h-7 w-3/4 bg-gray-700 rounded mb-1"></div>
      <div class="h-6 w-1/2 bg-gray-700 rounded"></div>
      <div class="h-10 w-2/3 bg-gray-700 rounded mt-1"></div>
      <div class="border-t border-gray-600 my-1"></div>
      <div class="flex flex-col gap-2 grow overflow-hidden">
        <div class="h-4 w-full bg-gray-700 rounded"></div>
        <div class="h-4 w-full bg-gray-700 rounded"></div>
        <div class="h-4 w-3/4 bg-gray-700 rounded"></div>
      </div>
    </div>

    <!-- Mobile label placeholder -->
    <div class="h-7 w-3/4 bg-gray-700 rounded md:hidden mb-2"></div>

    <!-- Footer Skeleton -->
    <div class="flex justify-between items-center">
      <div class="flex gap-4 items-center">
        <div class="w-6 h-6 bg-gray-700 rounded-full"></div>
        <div class="flex flex-col gap-1">
          <div class="h-4 w-24 bg-gray-700 rounded"></div>
          <div class="h-3 w-16 bg-gray-700 rounded"></div>
        </div>
      </div>
      <div class="h-10 w-16 bg-gray-700 rounded"></div>
    </div>
  </div>
</div>
