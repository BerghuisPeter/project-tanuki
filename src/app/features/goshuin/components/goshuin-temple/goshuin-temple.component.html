@if (templeImageUrl()) {
  <app-lazy-loaded-img
    [imageUrl]="templeImageUrl()"
    alt="temple"
    class="h-25 w-full overflow-hidden"/>
}

<h3
  class="text-xl text-[var(--mat-button-outlined-label-text-color)]">{{ temple().translations[currentLocale()]?.name }}</h3>
<a
  [href]="mapsUrl()"
  class="flex items-center gap-1 text-sm
  text-[var(--mat-form-field-outlined-error-caret-color)]
  hover:text-[var(--mat-sys-on-surface-variant)]
  transition-colors"
  rel="noopener noreferrer"
  target="_blank">
  <mat-icon [inline]="true">location_on</mat-icon>
  <span class="hidden md:inline">{{ temple().translations[currentLocale()]?.address }},</span>
  {{ temple().translations[currentLocale()]?.city }}
  , {{ temple().translations[currentLocale()]?.prefecture }}
</a>
